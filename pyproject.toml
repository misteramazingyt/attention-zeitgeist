[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-ledger"
version = "0.1.0"
description = "A local-first research pipeline approximating a time-use survey for the web (Civilizational Attention Ledger)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Attention Ledger Project" }]
keywords = ["attention", "web", "research", "duckdb", "wikimedia", "gdelt", "reddit"]

dependencies = [
    "duckdb>=0.10",
    "polars>=0.20",
    "pandas>=2.0",
    "pyarrow>=14",
    "typer>=0.9",
    "click>=8.1",
    "pydantic>=2.5",
    "httpx>=0.26",
    "requests>=2.31",
    "tldextract>=5.1",
    "python-dotenv>=1.0",
    "zstandard>=0.22",
    "rich>=13.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "altair>=5.0"]
ml = ["scikit-learn>=1.3", "sentence-transformers>=2.2"]
dev = ["pytest>=7.4", "ruff>=0.1", "mypy>=1.8"]

[project.scripts]
attention-ledger = "attention_ledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
